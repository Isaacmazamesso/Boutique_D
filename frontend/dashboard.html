<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Boutique D</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js" integrity="sha384-WBRt9V/J/erVtkEuP91HUFRv9MvHzFiFOp4/zTDp4xkcMG7aOeIv2asTV4yxFLWa" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="toast-container"></div>
<div class="sidebar-overlay"></div>
<div class="layout">
  <header class="topbar">
    <button class="topbar-menu-btn" id="menu-btn"><i data-lucide="menu" class="icon"></i></button>
    <div class="topbar-brand">
      <div class="brand-icon"><i data-lucide="shopping-bag" class="icon" style="width:15px;height:15px"></i></div>
      Boutique D
    </div>
    <div class="topbar-spacer"></div>
    <div class="topbar-user" id="topbar-user"></div>
    <button class="btn btn-ghost btn-sm" id="btn-logout">
      <i data-lucide="log-out" class="icon"></i> Déconnexion
    </button>
  </header>

  <nav class="sidebar">
    <div class="sidebar-section">Principal</div>
    <a href="dashboard.html" class="nav-item" data-role="proprietaire,gestionnaire">
      <span class="nav-icon-wrap"><i data-lucide="layout-grid" class="icon"></i></span> <span class="nav-label">Dashboard</span>
    </a>
    <a href="pos.html" class="nav-item">
      <span class="nav-icon-wrap"><i data-lucide="store" class="icon"></i></span> <span class="nav-label">Caisse (POS)</span>
    </a>
    <a href="vente-tablette.html" class="nav-item">
      <span class="nav-icon-wrap"><i data-lucide="tablet-smartphone" class="icon"></i></span> <span class="nav-label">Vente (tablette)</span>
    </a>
    <div class="sidebar-section" data-role="proprietaire,gestionnaire">Stock</div>
    <a href="stock.html" class="nav-item" data-role="proprietaire,gestionnaire">
      <span class="nav-icon-wrap"><i data-lucide="boxes" class="icon"></i></span> <span class="nav-label">Stock</span>
      <span class="nav-badge hidden" id="alert-badge">0</span>
    </a>
    <a href="products.html" class="nav-item" data-role="proprietaire,gestionnaire">
      <span class="nav-icon-wrap"><i data-lucide="tag" class="icon"></i></span> <span class="nav-label">Produits</span>
    </a>
    <div class="sidebar-section" data-role="proprietaire,gestionnaire">Gestion</div>
    <a href="clients.html" class="nav-item" data-role="proprietaire,gestionnaire">
      <span class="nav-icon-wrap"><i data-lucide="contact" class="icon"></i></span> <span class="nav-label">Clients</span>
    </a>
    <a href="users.html" class="nav-item" data-role="proprietaire">
      <span class="nav-icon-wrap"><i data-lucide="users" class="icon"></i></span> <span class="nav-label">Utilisateurs</span>
    </a>
    <a href="reports.html" class="nav-item" data-role="proprietaire">
      <span class="nav-icon-wrap"><i data-lucide="chart-column" class="icon"></i></span> <span class="nav-label">Rapports</span>
    </a>
    <a href="settings.html" class="nav-item" data-role="proprietaire">
      <span class="nav-icon-wrap"><i data-lucide="settings" class="icon"></i></span> <span class="nav-label">Paramètres</span>
    </a>
    <div class="sidebar-section">Compte</div>
    <a href="profile.html" class="nav-item">
      <span class="nav-icon-wrap"><i data-lucide="user" class="icon"></i></span> <span class="nav-label">Profil</span>
    </a>
  </nav>

  <!-- Main -->
  <main class="main">
    <div class="page-title">
      <div class="page-icon" style="background:var(--accent)">
        <i data-lucide="layout-grid" class="icon"></i>
      </div>
      Dashboard
      <small id="subtitle">Aujourd'hui</small>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid" id="kpi-grid">
      <div class="kpi-card primary skeleton" style="height:110px"></div>
      <div class="kpi-card skeleton" style="height:110px"></div>
      <div class="kpi-card skeleton" style="height:110px"></div>
      <div class="kpi-card skeleton" style="height:110px"></div>
    </div>

    <div class="grid grid-2 gap-4 mb-6" id="row2">
      <!-- Alertes -->
      <div class="card" id="card-alertes">
        <div class="card-header">
          <div class="card-title">
            <i data-lucide="bell" class="icon" style="color:var(--warning)"></i> Alertes
          </div>
        </div>
        <div class="card-body" id="alertes-body">
          <div class="skeleton" style="height:80px"></div>
        </div>
      </div>
      <!-- Caissiers -->
      <div class="card" id="card-caissiers">
        <div class="card-header">
          <div class="card-title">
            <i data-lucide="badge-check" class="icon" style="color:var(--accent)"></i> Caissiers actifs
          </div>
        </div>
        <div class="card-body" id="caissiers-body">
          <div class="skeleton" style="height:80px"></div>
        </div>
      </div>
    </div>

    <div class="grid grid-2 gap-4">
      <!-- Top 5 produits -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <i data-lucide="trophy" class="icon" style="color:var(--warning)"></i> Top 5 Produits — Aujourd'hui
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Produit</th>
                <th class="text-right">Qté</th>
                <th class="text-right">CA</th>
              </tr>
            </thead>
            <tbody id="top5-tbody"></tbody>
          </table>
        </div>
      </div>
      <!-- Périodes -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <i data-lucide="calendar" class="icon" style="color:var(--accent)"></i> Périodes
          </div>
        </div>
        <div class="card-body" id="periods-body"></div>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/offline.js"></script>
<script>
requireAuth();

async function loadDashboard() {
  const top5Tbody = document.getElementById('top5-tbody');
  if (!top5Tbody || !top5Tbody.querySelector('tr:not(.skeleton-row)')) showTableSkeleton('top5-tbody', 5);
  try {
    const d = await api.get('/dashboard');

    const evol = d.ca.evolution_pct !== null
      ? `${d.ca.evolution_pct > 0 ? '<i data-lucide="trending-up" class="icon"></i>' : '<i data-lucide="trending-down" class="icon"></i>'} ${Math.abs(d.ca.evolution_pct)}% vs hier`
      : 'Pas de données hier';

    document.getElementById('kpi-grid').innerHTML = `
      <div class="kpi-card primary">
        <div class="kpi-icon"><i data-lucide="wallet" class="icon" style="color:var(--accent)"></i></div>
        <div class="kpi-label">CA du jour</div>
        <div class="kpi-value">${fmt(d.ca.jour)}</div>
        <div class="kpi-sub">${evol}</div>
        <div class="kpi-spark" id="kpi-spark"></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon"><i data-lucide="shopping-bag" class="icon" style="color:var(--warning)"></i></div>
        <div class="kpi-label">Ventes</div>
        <div class="kpi-value">${d.ventes.nb_jour}</div>
        <div class="kpi-sub">Panier moy. ${fmt(d.ventes.panier_moyen)}</div>
      </div>
      <div class="kpi-card success">
        <div class="kpi-icon"><i data-lucide="trending-up" class="icon" style="color:var(--success)"></i></div>
        <div class="kpi-label">Bénéfice estimé</div>
        <div class="kpi-value">${fmt(d.benefice.jour)}</div>
        <div class="kpi-sub">Marge ${escHtml(String(d.benefice.marge_pct))}%</div>
      </div>
      <div class="kpi-card ${d.alertes.total > 0 ? 'danger' : ''}">
        <div class="kpi-icon"><i data-lucide="${d.alertes.total > 0 ? 'triangle-alert' : 'circle-check-big'}" class="icon" style="color:${d.alertes.total > 0 ? 'var(--danger)' : 'var(--success)'}"></i></div>
        <div class="kpi-label">Alertes</div>
        <div class="kpi-value">${d.alertes.total}</div>
        <div class="kpi-sub">${d.alertes.rupture} rupture · ${d.alertes.stock_bas} stock bas</div>
      </div>
    `;

    // Alertes détail
    const alertLines = [
      d.alertes.rupture    > 0 ? `<div class="alert alert-danger mb-2"><i data-lucide="circle-x" class="icon"></i> ${d.alertes.rupture} produit(s) en rupture de stock</div>`        : '',
      d.alertes.stock_bas  > 0 ? `<div class="alert alert-warning mb-2"><i data-lucide="triangle-alert" class="icon"></i> ${d.alertes.stock_bas} produit(s) en stock bas</div>`  : '',
      d.alertes.peremption > 0 ? `<div class="alert alert-warning mb-2"><i data-lucide="calendar-x" class="icon"></i> ${d.alertes.peremption} produit(s) bientôt périmé(s)</div>`       : '',
      d.alertes.ecarts_caisse > 0 ? `<div class="alert alert-danger mb-2"><i data-lucide="wallet" class="icon"></i> ${d.alertes.ecarts_caisse} session(s) avec écart de caisse</div>`     : '',
    ].filter(Boolean);
    document.getElementById('alertes-body').innerHTML = alertLines.length
      ? alertLines.join('')
      : '<div class="empty-state" style="padding:24px"><div class="icon-wrap"><i data-lucide="circle-check-big" class="icon" style="color:var(--success)"></i></div><p>Aucune alerte</p></div>';

    // Caissiers
    const caissierLines = d.caissiers.map(c => `
      <div class="flex items-center justify-between mb-2">
        <span class="font-bold">${escHtml(c.name)}</span>
        <div class="flex gap-2">
          <span class="badge ${c.en_ligne ? 'badge-success' : 'badge-neutral'}">
            <span style="width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block"></span>
            ${c.en_ligne ? 'En ligne' : 'Hors ligne'}
          </span>
          <span class="badge ${c.caisse_ouverte ? 'badge-accent' : 'badge-neutral'}">
            <i data-lucide="store" class="icon"></i>
            ${c.caisse_ouverte ? 'Ouverte' : 'Fermée'}
          </span>
        </div>
      </div>`);
    document.getElementById('caissiers-body').innerHTML = caissierLines.length
      ? caissierLines.join('')
      : '<div class="text-muted font-sm text-center" style="padding:20px">Aucun caissier actif</div>';

    // Top 5 produits
    const top5Rows = d.top5_produits.map(p => `
      <tr>
        <td>
          <span class="font-bold">${escHtml(p.product)}</span><br>
          <span class="text-muted font-sm">${escHtml(p.unit)}</span>
        </td>
        <td class="text-right font-bold">${p.total_qty}</td>
        <td class="text-right text-success font-bold">${fmt(p.total_ca)}</td>
      </tr>`);
    renderTable('top5-tbody', top5Rows, 'Aucune vente aujourd\'hui', 'shopping-cart');

    // Périodes
    document.getElementById('periods-body').innerHTML = `
      <div class="flex justify-between items-center mb-4">
        <span class="text-muted">CA Semaine</span>
        <span class="font-bold">${fmt(d.ca.semaine)}</span>
      </div>
      <div class="flex justify-between items-center mb-4">
        <span class="text-muted">CA Mois</span>
        <span class="font-bold">${fmt(d.ca.mois)}</span>
      </div>
      <div class="flex justify-between items-center mb-4">
        <span class="text-muted">CA Hier</span>
        <span class="font-bold">${fmt(d.ca.hier)}</span>
      </div>
      <hr style="border:none;border-top:1px solid var(--border);margin:14px 0">
      <div class="flex justify-between items-center">
        <span class="text-muted">Bénéfice mois (estimé)</span>
        <span class="font-bold text-success">${fmt(d.benefice.jour)}</span>
      </div>
    `;
    refreshIcons();

    loadSparkline();

  } catch (err) {
    toast(err.message, 'danger');
    renderTable('top5-tbody', [], 'Erreur de chargement', 'triangle-alert');
  }
}

async function loadSparkline() {
  try {
    const end = new Date();
    const start = new Date(); start.setDate(end.getDate() - 6);
    const iso = d => d.toISOString().slice(0, 10);
    const data = await api.get(`/reports/sales?period=custom&start_date=${iso(start)}&end_date=${iso(end)}`);
    const byDay = {};
    for (let i = 0; i < 7; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      byDay[d.toLocaleDateString('fr-FR')] = 0; // clé "jj/mm/aaaa"
    }
    (data.ventes || []).forEach(v => {
      const day = v.date.split(' ')[0]; // "jj/mm/aaaa hh:mm" → "jj/mm/aaaa"
      if (day in byDay) byDay[day] += v.total;
    });
    const el = document.getElementById('kpi-spark');
    if (el) el.innerHTML = sparklineSvg(Object.values(byDay));
  } catch { /* silencieux : le rôle sans accès rapports ou une erreur réseau masque simplement la sparkline */ }
}

loadDashboard();
setInterval(loadDashboard, 60000);
</script>
</body>
</html>
